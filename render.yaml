services:
  - type: web
    name: ca-agent-backend
    runtime: docker
    dockerfilePath: Dockerfile.backend
    plan: standard # 4 GB RAM recommended for embeddings and ML models
    region: oregon
    healthCheckPath: /docs
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: DEV_GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://ca-agent-frontend.vercel.app,http://localhost:8080"
      - key: OLLAMA_URL
        sync: false
